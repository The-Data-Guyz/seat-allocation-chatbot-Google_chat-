name: Bug report
description: Report a reproducible defect without including sensitive information.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use test data only. Do not include employee information or production IDs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised logs or screenshots
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Development
        - Test
        - Production
    validations:
      required: true
